description = "Multi-agent claim reasoning engine (work in progress)"
readme = "README.md"
authors = [
    { name = "Haseeb Ahmad", email = "haseebahmad.me625@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
